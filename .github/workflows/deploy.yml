name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "larinhazzz"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: larinhazzz/perfilinvestidor-ci:${{ github.sha }}

      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop perfilinvestidor
            docker rm --force perfilinvestidor
            docker run -d -p 8080:8080 --name perfilinvestidor \
              -e AUTH0_ISSUER="${{ vars.AUTH0_ISSUER || 'https://dev-s41b58hqkvvmdu13.us.auth0.com/' }}" \
              -e AUTH0_AUDIENCE="${{ vars.AUTH0_AUDIENCE || 'https://api.acessor-investimentos' }}" \
              -e FRONTEND_URL="${{ vars.FRONTEND_URL || 'http://localhost:5173' }}" \
              larinhazzz/perfilinvestidor-ci:${{ github.sha }}



