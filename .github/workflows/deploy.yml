name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "larinhazzz"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: larinhazzz/perfilinvestidor-ci:${{ github.sha }}

      - name: Deploy Profile Service
        uses: appleboy/ssh-action@master
        env:
          IMAGE_TAG: larinhazzz/perfilinvestidor-ci:${{ github.sha }}
          DB_HOST: ${{ vars.DB_HOST || 'portfolio-postgres' }}
          DB_NAME: ${{ vars.DB_NAME || 'investor_profile' }}
          DB_USERNAME: ${{ vars.DB_USERNAME || 'portfolio' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'portfolio' }}
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER || 'https://dev-s41b58hqkvvmdu13.us.auth0.com/' }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE || 'https://api.crescit-investimentos' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://crescit-frontend.vercel.app' }}
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          envs: IMAGE_TAG,DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD,AUTH0_ISSUER,AUTH0_AUDIENCE,FRONTEND_URL
          script_path: scripts/deploy.sh



