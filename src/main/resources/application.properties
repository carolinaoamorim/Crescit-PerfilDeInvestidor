spring.application.name=perfil-investidor

# PostgreSQL próprio do Serviço de Perfil
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investor_profile}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O schema é criado pelas migrations do Flyway; o Hibernate só confere se bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=investment.events
app.rabbitmq.routing-keys.profile-updated=profile.updated

# Auth0 (único para os três serviços): valida assinatura, issuer e audience do JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-s41b58hqkvvmdu13.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.acessor-investimentos}

# CORS: origens do frontend separadas por vírgula
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
